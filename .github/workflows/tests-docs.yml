# Doc-spec validation. Runs on PRs that touch the docspec or any source
# file referenced by a docspec `source:` pointer (commands, agents,
# designers, indexers, config, etc.).
#
# Two checks:
#   1. `saifdocs gen --project-dir . --dry-run` — schema validation
#      (frontmatter, type enums, source: path existence) and writes
#      the manifest with content hashes populated from disk.
#   2. `saifdocs validate --docspec-dir docspec` — staleness check:
#      any `read` path whose current SHA-256 differs from the recorded
#      one means the docs need regenerating before merge.
#
# Hash-based staleness is filesystem-independent — works on a fresh CI
# checkout, file copy, tar extract, or any other transport that resets
# mtimes. (Saifdocs ≥ 0.4.0; manifest schema v2.)

name: Docs validation

on:
  push:
    branches: [main]
    paths:
      - 'docspec/**'
      - 'docs/**'
      - 'src/cli/commands/**'
      - 'src/agent-profiles/**'
      - 'src/designer-profiles/**'
      - 'src/indexer-profiles/**'
      - 'src/sandbox-profiles/**'
      - 'src/test-profiles/**'
      - 'src/config/**'
      - 'src/storage/**'
      - 'src/orchestrator/agent-env.ts'
      - 'src/llm-config.ts'
      - 'src/constants.ts'
      - 'scripts/docker.ts'
      - 'vendor/saifdocs'
      - '.github/workflows/tests-docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docspec/**'
      - 'docs/**'
      - 'src/cli/commands/**'
      - 'src/agent-profiles/**'
      - 'src/designer-profiles/**'
      - 'src/indexer-profiles/**'
      - 'src/sandbox-profiles/**'
      - 'src/test-profiles/**'
      - 'src/config/**'
      - 'src/storage/**'
      - 'src/orchestrator/agent-env.ts'
      - 'src/llm-config.ts'
      - 'src/constants.ts'
      - 'scripts/docker.ts'
      - 'vendor/saifdocs'
      - '.github/workflows/tests-docs.yml'

concurrency:
  group: tests-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install saifdocs deps
        working-directory: vendor/saifdocs
        run: pnpm install --frozen-lockfile

      - name: Build saifdocs
        working-directory: vendor/saifdocs
        run: pnpm run build

      # Schema check: builds the manifest from `docspec/` and validates
      # frontmatter shape, type enums, and source: path existence. Writes
      # `docspec/.manifest.json` with content hashes populated from disk.
      # Exit code is non-zero if any docspec entry fails validation.
      - name: Validate docspec
        run: node vendor/saifdocs/dist/cli.js gen --project-dir . --dry-run

      # Staleness check: any `read` path whose current SHA-256 differs
      # from the manifest-recorded hash means the docs need regenerating.
      # Reminds you to re-run `saifdocs gen` + `saifctl feat run` before
      # merging.
      - name: Validate docs are not stale
        run: node vendor/saifdocs/dist/cli.js validate --docspec-dir docspec
